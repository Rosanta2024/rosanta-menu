<style>
  :root{

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--crema);color:var(--verde);font-family:var(--sans);font-weight:300;
       -webkit-font-smoothing:antialiased;line-height:1.5}
  a{color:inherit}
  .wrap{max-width:780px;margin:0 auto;padding:20px 22px 64px}

  /* ---------- cabecera ---------- */
  header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:14px}
  .mark{font-family:var(--serif);letter-spacing:.34em;font-size:15px;text-transform:uppercase}
  .lang{display:flex;border:1px solid var(--linea);border-radius:999px;overflow:hidden}
  .lang button{font-family:var(--sans);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    padding:7px 14px;border:0;background:transparent;color:var(--verde);cursor:pointer}
  .lang button[aria-pressed="true"]{background:var(--verde);color:var(--crema)}

  /* ---------- nav ---------- */
  nav.secs{position:sticky;top:0;z-index:9;background:var(--crema);
    border-top:1px solid var(--linea);border-bottom:1px solid var(--linea);
    margin:0 -22px;padding:10px 22px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
  nav.secs::-webkit-scrollbar{display:none}
  nav.secs a{flex:0 0 auto;text-decoration:none;color:var(--verde);font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;padding:6px 12px;border:1px solid var(--linea);border-radius:999px;white-space:nowrap}
  nav.secs a.on{background:var(--verde);color:var(--crema);border-color:var(--verde)}

  /* ---------- intro ---------- */
  .intro{padding:34px 0 6px;border-bottom:1px solid var(--linea-suave)}
  .eyebrow{font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;opacity:.65;margin-bottom:12px}
  .intro .lead{font-family:var(--serif);font-size:21px;line-height:1.4;font-style:italic;font-weight:400;margin:0 0 18px;max-width:30ch}
  .intro p{font-size:13.5px;line-height:1.7;margin:0 0 13px;max-width:62ch;opacity:.92}
  .intro details{margin:2px 0 22px}
  .intro summary{cursor:pointer;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;
    list-style:none;display:inline-block;padding:7px 14px;border:1px solid var(--linea);border-radius:999px}
  .intro summary::-webkit-details-marker{display:none}
  .intro details[open] summary{margin-bottom:16px}
  .coord{display:flex;gap:14px;align-items:baseline;padding:16px 0 26px}
  .coord b{font-family:var(--serif);font-weight:500;letter-spacing:.18em;white-space:nowrap;font-size:13px}
  .coord span{font-size:12px;font-style:italic;opacity:.8;line-height:1.5}

  /* ---------- secciones ---------- */
  section{padding:40px 0 4px;scroll-margin-top:58px}
  .sec-title{font-family:var(--serif);font-weight:500;text-transform:uppercase;letter-spacing:.14em;
    font-size:21px;margin:0 0 10px;line-height:1.25}
  .sec-rule{height:1px;background:var(--linea);margin:0 0 14px}
  .sec-intro{font-size:13px;line-height:1.65;font-style:italic;opacity:.85;margin:0 0 26px;max-width:60ch}

  /* ---------- platos ---------- */
  .item{padding:17px 0;border-bottom:1px solid var(--linea-suave)}
  .row{display:flex;align-items:baseline;gap:10px}
  .name{font-family:var(--serif);font-size:16.5px;font-weight:500;text-transform:uppercase;
    letter-spacing:.05em;line-height:1.3}
  .dots{flex:1;border-bottom:1px dotted var(--linea);transform:translateY(-4px);min-width:14px}
  .price{font-size:14px;letter-spacing:.04em;white-space:nowrap}
  .price2{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.8;margin:6px 0 0}
  .desc{font-size:13.5px;line-height:1.6;margin:7px 0 0;max-width:60ch}
  .x{font-size:12.5px;font-style:italic;opacity:.8;margin:6px 0 0}
  .mar{font-size:12.5px;line-height:1.55;margin:8px 0 0;max-width:60ch;opacity:.9}
  .mar b{font-weight:400;font-style:italic}
  .nota{font-size:11.5px;line-height:1.5;margin:7px 0 0;opacity:.72;max-width:60ch}
  .nota .flor{margin-right:6px}
  .nota a{color:var(--acento)}

  /* ---------- grids (guarniciones / bebidas) ---------- */
  .grid-block{margin-top:34px;padding-top:26px;border-top:1px solid var(--linea)}
  .grid-title{font-family:var(--serif);text-transform:uppercase;letter-spacing:.14em;font-size:15px;margin:0 0 6px}
  .grid-intro{font-size:12.5px;font-style:italic;opacity:.8;margin:0 0 16px}
  .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 34px}
  .group{break-inside:avoid;margin-bottom:20px}
  .group h4{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;opacity:.65;
    margin:0 0 8px;font-weight:400}
  .line{display:flex;align-items:baseline;gap:8px;padding:5px 0}
  .line .n{font-size:13.5px;line-height:1.35}
  .line .d2{flex:1;border-bottom:1px dotted var(--linea);transform:translateY(-4px);min-width:10px}
  .line .p{font-size:13px;white-space:nowrap}
  .line-desc{font-size:11.5px;opacity:.72;margin:0 0 6px;line-height:1.45;max-width:34ch}

  /* ---------- pie ---------- */
  footer{margin-top:52px;padding-top:20px;border-top:1px solid var(--linea);
    display:flex;justify-content:space-between;align-items:flex-start;gap:18px;
    font-size:11.5px;line-height:1.8;letter-spacing:.04em}
  footer .brand{font-family:var(--serif);letter-spacing:.16em;text-transform:uppercase}
  footer .cd{font-family:var(--serif);letter-spacing:.2em;white-space:nowrap;flex:0 0 auto}

  @media (max-width:560px){
    .wrap{padding:18px 16px 52px}
    nav.secs{margin:0 -16px;padding:10px 16px}
    .cols{grid-template-columns:1fr;gap:0}
    .intro .lead{font-size:19px}
    .name{font-size:15.5px}
  }
</style>

const FOOT = {
  es: { line1: 'Rosanta · Gastronomía Sostenible', line2: 'Se agrega 10% de propina sugerida a tu cuenta.' },
  en: { line1: 'Rosanta · Sustainable Gastronomy', line2: 'A 10% suggested gratuity is added to your check.' }
};

const UI = {
  es: { menu: 'Menú', intro: 'Cocina con propósito' },
  en: { menu: 'Menu', intro: 'Cooking with purpose' }
};


let lang = (new URLSearchParams(location.search).get('lang') === 'en') ? 'en' : 'es';

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

function itemHTML(it){
  const t = it[lang];
  let h = '<div class="item"><div class="row"><span class="name">' + esc(t.n) + '</span>';
  if(it.q){ h += '<span class="dots"></span><span class="price">Q' + it.q + '</span>'; }
  h += '</div>';
  if(t.p)  h += '<p class="price2">' + esc(t.p) + '</p>';
  if(t.p2) h += '<p class="price2">' + esc(t.p2) + '</p>';
  if(t.d)  h += '<p class="desc">' + esc(t.d) + '</p>';
  if(t.x)  h += '<p class="x">' + esc(t.x) + '</p>';
  if(t.m)  h += '<p class="mar"><b>' + (lang==='es'?'Maridaje':'Pairing') + ':</b> ' + esc(t.m) + '</p>';
  (t.notas||[]).forEach(n => { h += '<p class="nota"><span class="flor">&#10048;</span>' + esc(n) + '</p>'; });
  if(t.link) h += '<p class="nota"><a href="' + t.link.u + '" target="_blank" rel="noopener">' + esc(t.link.t) + '</a></p>';
  return h + '</div>';
}

function gridHTML(g){
  let h = '<div class="grid-block">';
  if(g[lang] && g[lang].title) h += '<h3 class="grid-title">' + esc(g[lang].title) + '</h3>';
  if(g[lang] && g[lang].intro) h += '<p class="grid-intro">' + esc(g[lang].intro) + '</p>';
  h += '<div class="cols">';
  g.groups.forEach(gr => {
    h += '<div class="group">';
    if(gr[lang]) h += '<h4>' + esc(gr[lang]) + '</h4>';
    gr.items.forEach(i => {
      h += '<div class="line"><span class="n">' + esc(i[lang]) + '</span><span class="d2"></span><span class="p">Q' + i.q + '</span></div>';
      const d = lang === 'es' ? i.dEs : i.dEn;
      if(d) h += '<p class="line-desc">' + esc(d) + '</p>';
    });
    h += '</div>';
  });
  return h + '</div></div>';
}

function render(){
  document.documentElement.lang = lang;
  const t = INTRO[lang];

  /* nav */
  document.getElementById('nav').innerHTML =
    '<a href="#intro-anchor" class="on">' + esc(t.kicker) + '</a>' +
    MENU.map(s => '<a href="#' + s.id + '">' + esc(s[lang].eyebrow) + '</a>').join('');

  /* intro */
  document.getElementById('intro').innerHTML =
    '<div id="intro-anchor"></div>' +
    '<p class="eyebrow">' + esc(t.kicker) + '</p>' +
    '<p class="lead">' + esc(t.lead) + '</p>' +
    '<p>' + esc(t.body[0]) + '</p>' +
    '<details><summary>' + (lang==='es'?'Seguir leyendo':'Keep reading') + '</summary>' +
      t.body.slice(1).map(p => '<p>' + esc(p) + '</p>').join('') +
    '</details>' +
    '<div class="coord"><b>14&deg; N &middot; 91&deg; W</b><span>' + esc(t.coordNote) + '</span></div>';

  /* secciones */
  document.getElementById('menu').innerHTML = MENU.map(s => {
    let h = '<section id="' + s.id + '"><p class="eyebrow">' + esc(s[lang].eyebrow) + '</p>' +
            '<h2 class="sec-title">' + esc(s[lang].title) + '</h2><div class="sec-rule"></div>' +
            '<p class="sec-intro">' + esc(s[lang].intro) + '</p>';
    h += s.items.map(itemHTML).join('');
    if(s.grid) h += gridHTML(s.grid);
    return h + '</section>';
  }).join('');

  /* pie */
  document.getElementById('foot').innerHTML =
    '<div><span class="brand">' + esc(FOOT[lang].line1) + '</span><br>' + esc(FOOT[lang].line2) + '</div>' +
    '<span class="cd">14&deg; N &middot; 91&deg; W</span>';

  document.querySelectorAll('.lang button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  sendHeight();
}

document.querySelectorAll('.lang button').forEach(b => {
  b.addEventListener('click', () => { lang = b.dataset.lang; render(); window.scrollTo(0,0); });
});

addEventListener('scroll', () => {
  let cur = null;
  document.querySelectorAll('section').forEach(s => {
    if(s.getBoundingClientRect().top <= 90) cur = s.id;
  });
  document.querySelectorAll('nav.secs a').forEach((a,i) => {
    a.classList.toggle('on', cur ? a.getAttribute('href') === '#' + cur : i === 0);
  });
}, {passive:true});

/* auto-altura para el componente HTML de Wix (Velo: $w('#html1').onMessage) */
function sendHeight(){
  try{ parent.postMessage({rosantaMenuHeight: document.body.scrollHeight}, '*'); }catch(e){}
}
addEventListener('load', sendHeight);
addEventListener('resize', sendHeight);
document.addEventListener('toggle', sendHeight, true);

render();
</script>
